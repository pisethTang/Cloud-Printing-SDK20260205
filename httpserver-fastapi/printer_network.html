<!DOCTYPE html><html lang="zh-CN"><head><meta charset="gbk"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Ethernet configuration</title><link rel="icon" href="data:;base64,=" /><style>*{box-sizing:border-box;padding:0;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.container{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,0.2);width:100%;max-width:400px;padding:25px}h1{color:#333;margin:0 0 20px;text-align:center;font-size:20px}.btn-back{display:inline-block;padding:8px 16px;background:#667eea;color:#fff;text-decoration:none;border-radius:6px;margin-bottom:15px;font-size:13px}.form-group{margin-bottom:15px}.form-group label{display:block;color:#555;margin-bottom:5px;font-size:14px}.form-group > input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;-moz-appearance:textfield}.form-group input::-webkit-outer-spin-button,.form-group input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.form-group input:focus{outline:none;border-color:#667eea}.radio-group{display:flex;gap:15px}.radio-label{display:flex;align-items:center;cursor:pointer;font-size:14px;color:#555}.radio-label input{margin-right:6px}.disabled{opacity:0.5;pointer-events:none}.btn-submit{width:100%;padding:12px;background:#4CAF50;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer;margin-top:10px}</style></head><body><div class="container"><a href="index.html" class="btn-back">← Return</a><h1>Ethernet configuration</h1><form onsubmit="return submitConfig()"><div class="form-group"><div class="radio-group"><label class="radio-label"><input type="radio" name="dhcp" value="1" checked onclick="toggleDhcp(true)"/> DHCP</label><label class="radio-label"><input type="radio" name="dhcp" value="0"  onclick="toggleDhcp(false)"/> Static IP</label></div></div><div class="form-group disabled" id="static-opts"><label>IP</label><input type="text" name="ip" value="0.0.0.0"/></div><div class="form-group disabled" id="mask-opts"><label>Mask</label><input type="text" name="mask" value="0.0.0.0"/></div><div class="form-group disabled" id="gw-opts"><label>Gateway</label><input type="text" name="gw" value="0.0.0.0"/></div><div class="form-group"><label>MAC(Optional)</label><input type="text" name="mac" value="72:67:05:08:76:08" maxlength="17"/></div><button type="submit" class="btn-submit">Save</button></form></div><script>function toggleDhcp(en){['static-opts','mask-opts','gw-opts'].forEach(id=>document.getElementById(id).className='form-group'+(en?' disabled':''));}function submitConfig(){const dhcp=document.querySelector('input[name="dhcp"]:checked').value;const param={type:1,dhcp:parseInt(dhcp),ip:document.querySelector('[name="ip"]').value,mask:document.querySelector('[name="mask"]').value,gw:document.querySelector('[name="gw"]').value,mac:document.querySelector('[name="mac"]').value};fetch('/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(param)}).then(r=>r.json()).then(d=>alert('Success')).catch(e=>alert('Failure'));return false;}toggleDhcp(true);</script></body></html>
