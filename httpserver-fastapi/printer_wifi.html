<!DOCTYPE html><html lang="zh-CN"><head><meta charset="gbk"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>WIFI Configure</title><link rel="icon" href="data:;base64,=" /><style>*{box-sizing:border-box;padding:0;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.c{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,0.2);width:100%;max-width:400px;padding:25px}h1{color:#333;margin:0 0 20px;text-align:center;font-size:20px}.b{display:inline-block;padding:8px 16px;background:#667eea;color:#fff;text-decoration:none;border-radius:6px;margin-bottom:15px;font-size:13px}.g{margin-bottom:15px}.g label{display:block;color:#555;margin-bottom:5px;font-size:14px}.g > input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px}.g input:focus{outline:none;border-color:#667eea}.r{display:flex;gap:15px}.r label{display:flex;align-items:center;cursor:pointer;font-size:14px;color:#555}.r input{margin-right:6px}.d{opacity:0.5;pointer-events:none}.s{width:100%;padding:12px;background:#2196F3;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer;margin-top:10px}</style></head><body><div class="c"><a href="index.html" class="b">← Back</a><h1>WIFI Configure</h1><form onsubmit="return s()"><div class="g"><label>SSID</label><input type="text" name="ssid" value="Thinclab"/></div><div class="g"><label>Password</label><input type="password" name="pwd" value="Innovation2017"/></div><div class="g"><div class="r"><label><input type="radio" name="dhcp" value="1" checked onclick="t(1)"/> DHCP</label><label><input type="radio" name="dhcp" value="0"  onclick="t(0)"/> Static IP</label></div></div><div class="g d" id="ip"><label>IP</label><input type="text" name="ip" value="192.168.137.53"/></div><div class="g d" id="mask"><label>Mask</label><input type="text" name="mask" value="255.255.255.0"/></div><div class="g d" id="gw"><label>Gateway</label><input type="text" name="gw" value="192.168.137.1"/></div><button type="submit" class="s">Save</button></form></div><script>function t(v){['ip','mask','gw'].forEach(id=>document.getElementById(id).className='g'+(v?' d':''))}function s(){const dhcp=document.querySelector('input[name="dhcp"]:checked').value;fetch('/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:2,dhcp:parseInt(dhcp),ssid:document.querySelector('[name="ssid"]').value,pwd:document.querySelector('[name="pwd"]').value,ip:document.querySelector('[name="ip"]').value,mask:document.querySelector('[name="mask"]').value,gw:document.querySelector('[name="gw"]').value})}).then(r=>r.json()).then(d=>alert('Success')).catch(e=>alert('Failure'));return false;}t(1);</script></body></html>
